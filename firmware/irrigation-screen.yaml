    # ── History: watering per day for the last 7 days (stacked by zone); tap a day for its zones ──
    - id: history_page
      styles: page_style
      scrollable: false
      on_swipe_right:
        - lvgl.page.show: {id: home_page, animation: MOVE_RIGHT, time: 180ms}
      widgets:
        - button:
            styles: back_btn
            align: TOP_LEFT
            x: -8
            on_click: {lvgl.page.show: {id: home_page, animation: MOVE_RIGHT, time: 180ms}}
            widgets:
              - label:
                  align: CENTER
                  text_font: icons_28
                  text_color: ${ink}
                  text: "\U000F0141"
        - label: {align: TOP_LEFT, x: 40, y: 4, text_font: montserrat_24, text: "History"}
        - button:
            id: hs_week
            align: TOP_RIGHT
            x: -78
            width: 78
            height: 34
            radius: 10
            shadow_width: 0
            bg_color: 0x1E6091
            on_click:
              - lambda: id(hist_view) = 0;
              - script.execute: refresh_history
            widgets: [{label: {id: hs_week_l, align: CENTER, text_font: montserrat_16, text_color: 0xFFFFFF, text: "7 days"}}]
        - button:
            id: hs_day
            align: TOP_RIGHT
            width: 72
            height: 34
            radius: 10
            shadow_width: 0
            bg_color: 0xE9EEF2
            on_click:
              - lambda: |-
                  if (id(hist_view) == 0) id(hist_day) = hist::local_day(id(sntp_time).now().timestamp);
                  id(hist_view) = 1;
              - script.execute: refresh_history
            widgets: [{label: {id: hs_day_l, align: CENTER, text_font: montserrat_16, text: "Day"}}]
