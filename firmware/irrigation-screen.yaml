  - id: refresh_prog
    then:
      - lambda: |-
            const int p = id(cur_prog);
            static const char *const L[4] = {"A", "B", "C", "D"};
            ui::text(id(pg_title), std::string("Program ") + L[p & 3]);
            ui::checked(id(pg_sw), ui::prog_on(p));
            const std::string mode = ui::prog_mode(p);
            const char *const opts[4] = {"Days of the week", "Every N days", "Odd dates", "Even dates"};
            { const bool on = mode == opts[0] || (0 == 0 && mode.empty());
              ui::bg(id(pg_m0), on ? 0x1E6091 : 0xE9EEF2); ui::fg(id(pg_m0_l), on ? 0xFFFFFF : ${ink}); }
            { const bool on = mode == opts[1] || (1 == 0 && mode.empty());
              ui::bg(id(pg_m1), on ? 0x1E6091 : 0xE9EEF2); ui::fg(id(pg_m1_l), on ? 0xFFFFFF : ${ink}); }
            { const bool on = mode == opts[2] || (2 == 0 && mode.empty());
              ui::bg(id(pg_m2), on ? 0x1E6091 : 0xE9EEF2); ui::fg(id(pg_m2_l), on ? 0xFFFFFF : ${ink}); }
            { const bool on = mode == opts[3] || (3 == 0 && mode.empty());
              ui::bg(id(pg_m3), on ? 0x1E6091 : 0xE9EEF2); ui::fg(id(pg_m3_l), on ? 0xFFFFFF : ${ink}); }
            const bool custom = mode == "Days of the week" || mode.empty();
            ui::vis(id(pg_days_row), custom);
            ui::vis(id(pg_cyc), mode == "Every N days");
            ui::text(id(pg_cyc_v), std::to_string(ui::prog_every(p)));
            ui::vis(id(pg_next), mode == "Every N days");
            { const int d = ui::prog_starts_in(p);
              ui::text(id(pg_next_v), d <= 0 ? "Today" : d == 1 ? "Tomorrow" : "In " + std::to_string(d) + " days"); }
            const uint8_t dm = ui::prog_days(p);
            ui::bg(id(pg_d0), (dm & 1) ? 0x2E7D32 : 0xE9EEF2); ui::fg(id(pg_d0_l), (dm & 1) ? 0xFFFFFF : ${ink});
            ui::bg(id(pg_d1), (dm & 2) ? 0x2E7D32 : 0xE9EEF2); ui::fg(id(pg_d1_l), (dm & 2) ? 0xFFFFFF : ${ink});
            ui::bg(id(pg_d2), (dm & 4) ? 0x2E7D32 : 0xE9EEF2); ui::fg(id(pg_d2_l), (dm & 4) ? 0xFFFFFF : ${ink});
            ui::bg(id(pg_d3), (dm & 8) ? 0x2E7D32 : 0xE9EEF2); ui::fg(id(pg_d3_l), (dm & 8) ? 0xFFFFFF : ${ink});
            ui::bg(id(pg_d4), (dm & 16) ? 0x2E7D32 : 0xE9EEF2); ui::fg(id(pg_d4_l), (dm & 16) ? 0xFFFFFF : ${ink});
            ui::bg(id(pg_d5), (dm & 32) ? 0x2E7D32 : 0xE9EEF2); ui::fg(id(pg_d5_l), (dm & 32) ? 0xFFFFFF : ${ink});
            ui::bg(id(pg_d6), (dm & 64) ? 0x2E7D32 : 0xE9EEF2); ui::fg(id(pg_d6_l), (dm & 64) ? 0xFFFFFF : ${ink});
            const auto st = ui::starts(p);
            ui::vis(id(pg_s0), 0 < (int) st.size());
            if (0 < (int) st.size()) ui::text(id(pg_s0_l), ui::clock12(st[0]) + "   x");
            ui::vis(id(pg_s1), 1 < (int) st.size());
            if (1 < (int) st.size()) ui::text(id(pg_s1_l), ui::clock12(st[1]) + "   x");
            ui::vis(id(pg_s2), 2 < (int) st.size());
            if (2 < (int) st.size()) ui::text(id(pg_s2_l), ui::clock12(st[2]) + "   x");
            ui::vis(id(pg_s3), 3 < (int) st.size());
            if (3 < (int) st.size()) ui::text(id(pg_s3_l), ui::clock12(st[3]) + "   x");
            ui::vis(id(pg_sadd), st.size() < 4);
            int total = 0;
            ui::vis(id(pg_z1), ui::zone_enabled(1));
            ui::text(id(pg_z1_n), ui::zone_name(1));
            ui::text(id(pg_z1_v), std::to_string(ui::prog_minutes(p, 1)));
            if (ui::zone_enabled(1)) total += ui::prog_minutes(p, 1);
            ui::vis(id(pg_z2), ui::zone_enabled(2));
            ui::text(id(pg_z2_n), ui::zone_name(2));
            ui::text(id(pg_z2_v), std::to_string(ui::prog_minutes(p, 2)));
            if (ui::zone_enabled(2)) total += ui::prog_minutes(p, 2);
            ui::vis(id(pg_z3), ui::zone_enabled(3));
            ui::text(id(pg_z3_n), ui::zone_name(3));
            ui::text(id(pg_z3_v), std::to_string(ui::prog_minutes(p, 3)));
            if (ui::zone_enabled(3)) total += ui::prog_minutes(p, 3);
            ui::vis(id(pg_z4), ui::zone_enabled(4));
            ui::text(id(pg_z4_n), ui::zone_name(4));
            ui::text(id(pg_z4_v), std::to_string(ui::prog_minutes(p, 4)));
            if (ui::zone_enabled(4)) total += ui::prog_minutes(p, 4);
            ui::vis(id(pg_z5), ui::zone_enabled(5));
            ui::text(id(pg_z5_n), ui::zone_name(5));
            ui::text(id(pg_z5_v), std::to_string(ui::prog_minutes(p, 5)));
            if (ui::zone_enabled(5)) total += ui::prog_minutes(p, 5);
            ui::vis(id(pg_z6), ui::zone_enabled(6));
            ui::text(id(pg_z6_n), ui::zone_name(6));
            ui::text(id(pg_z6_v), std::to_string(ui::prog_minutes(p, 6)));
            if (ui::zone_enabled(6)) total += ui::prog_minutes(p, 6);
            ui::vis(id(pg_z7), ui::zone_enabled(7));
            ui::text(id(pg_z7_n), ui::zone_name(7));
            ui::text(id(pg_z7_v), std::to_string(ui::prog_minutes(p, 7)));
            if (ui::zone_enabled(7)) total += ui::prog_minutes(p, 7);
            ui::vis(id(pg_z8), ui::zone_enabled(8));
            ui::text(id(pg_z8_n), ui::zone_name(8));
