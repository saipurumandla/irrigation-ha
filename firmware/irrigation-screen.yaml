  - id: join_wifi
    parameters:
      ssid: std::string
      password: std::string
    then:
      - lambda: |-
          ui::link().send_wifi(ssid, password);   // the A8 joins too
          ui::text(id(wf_status), "Connecting to " + ssid + "...");
          ui::fg(id(wf_status), ${muted});
      - wifi.configure:
          ssid: !lambda return ssid;
          password: !lambda return password;
          save: true
          timeout: 30s
          on_connect:
            - lambda: |-
                ui::text(id(wf_status), "Connected to " + ui::wifi_current());
                ui::fg(id(wf_status), 0x2E7D32);
          on_error:
            - lambda: |-
                ui::text(id(wf_status), "Couldn't connect - kept " + ui::wifi_current());
                ui::fg(id(wf_status), 0xB3261E);
  - id: refresh_wifi
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          const std::string cur = ui::wifi_current();
          ui::text(id(wf_cur), cur.empty() ? std::string("Not connected") : cur + "   (" + std::to_string((int) w->wifi_rssi()) + " dBm)");
          auto nets = ui::wifi_networks();
          ui::vis(id(wf_n0), 0 < (int) nets.size());
          if (0 < (int) nets.size()) ui::text(id(wf_n0_l), ui::ascii(nets[0].first) + (nets[0].first == cur ? "   (connected)" : ""));
          ui::vis(id(wf_n1), 1 < (int) nets.size());
          if (1 < (int) nets.size()) ui::text(id(wf_n1_l), ui::ascii(nets[1].first) + (nets[1].first == cur ? "   (connected)" : ""));
          ui::vis(id(wf_n2), 2 < (int) nets.size());
          if (2 < (int) nets.size()) ui::text(id(wf_n2_l), ui::ascii(nets[2].first) + (nets[2].first == cur ? "   (connected)" : ""));
          ui::vis(id(wf_n3), 3 < (int) nets.size());
          if (3 < (int) nets.size()) ui::text(id(wf_n3_l), ui::ascii(nets[3].first) + (nets[3].first == cur ? "   (connected)" : ""));
          ui::vis(id(wf_n4), 4 < (int) nets.size());
          if (4 < (int) nets.size()) ui::text(id(wf_n4_l), ui::ascii(nets[4].first) + (nets[4].first == cur ? "   (connected)" : ""));
          ui::vis(id(wf_n5), 5 < (int) nets.size());
          if (5 < (int) nets.size()) ui::text(id(wf_n5_l), ui::ascii(nets[5].first) + (nets[5].first == cur ? "   (connected)" : ""));
          ui::vis(id(wf_n6), 6 < (int) nets.size());
          if (6 < (int) nets.size()) ui::text(id(wf_n6_l), ui::ascii(nets[6].first) + (nets[6].first == cur ? "   (connected)" : ""));
          ui::vis(id(wf_n7), 7 < (int) nets.size());
          if (7 < (int) nets.size()) ui::text(id(wf_n7_l), ui::ascii(nets[7].first) + (nets[7].first == cur ? "   (connected)" : ""));
  - id: rename_save
    then:
      - lambda: |-
          const std::string nm = ui::ta_text(id(rn_text));
          const std::string key = "text.zone_" + std::to_string(id(cur_zone)) + "_name";
          ESP_LOGI("ui", "Rename zone %d -> \"%s\" (%s)", id(cur_zone), nm.c_str(), key.c_str());
          ui::link().set(key, nm);
      - lvgl.widget.hide: rn_sheet
