# Irrigation screen: Hosyond / LCDWIKI ES3C35P (ESP32-S3, 8 MB PSRAM, 16 MB flash), 3.5" IPS
# 320x480, ST77922 over QSPI with the ST77922's own (Sitronix) touch on I2C 0x55. It sits in the
# irrigation case's lid and talks to the A8 over its UART socket (5V GND TXD RXD -> A8 S1/S2).
#
# The irrigation box's face: Home, Zones, Schedule, History, Settings. See docs/irrigation-screen.md.
# Pins (ES3C35P spec V1.0 + schematic): LCD CS 10, CLK 12, D0-D3 11/13/14/9; GPIO48 resets the
# whole ST77922 (display and touch); backlight 41 (high = on); touch SDA 38, SCL 39, INT 47; RGB LED 40; audio amp
# enable 1 (low = on); UART0 TX 43 / RX 44 (the A8 link).
# Panel init: the seller's table, read from the factory flash backup
# (~/esp-backups/es3c35p-screen-factory-2026-11-05.bin); see components/st77922_qspi.

substitutions:
  name: irrigation-screen
  friendly_name: Irrigation screen
  # Black edge drawn on the left (and optionally bottom) to balance the panel's own black edge (px).
  bezel_left: "30"
  bezel_bottom: "0"
  # Light theme (chosen 2026-11-05: hides the backlight bleed)
  paper: "0xE9EEF2"
  ink: "0x1B2733"
  muted: "0x5B6B78"
  # Backlight: day hours, idle dim and off (the board has no light sensor).
  day_from: "7"
  day_until: "20"
  dim_after: "30"
  off_after: "60"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - screen/a8_link_client.h
    - screen/ui.h
    - screen/history.h
  on_boot:
    priority: 600
    then:
      - output.turn_on: amp_off   # keep the speaker amplifier off (nothing plays audio)
      - lambda: a8link::client().begin(id(a8_uart));
      - lambda: hist::history().begin();
      - script.execute: apply_brightness

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG   # UART0 (the socket) is kept for the A8

api:
  encryption:
    key: !secret irrigation_screen_api_key

ota:
  - platform: esphome
    password: !secret irrigation_screen_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} setup"
  on_connect:
    - lvgl.label.update: {id: wifi_icon, text: "\U000F05A9", text_color: 0x2E7D32}
  on_disconnect:
    - lvgl.label.update: {id: wifi_icon, text: "\U000F05AA", text_color: 0xB3261E}

captive_portal:

text_sensor:
  - platform: wifi_info
    scan_results:
      name: "Wi-Fi networks seen"
      entity_category: diagnostic
    ssid:
      id: wifi_ssid_now
      on_value:
        - lambda: ui::wifi_ssid_cache() = x;
      name: "Wi-Fi network"
      entity_category: diagnostic

# The wired link to the A8 (irrigation.yaml), on the screen's UART socket: our TXD
# (GPIO43) goes to the A8's RX (S2), our RXD (GPIO44) to its TX (S1). Logs go to USB instead.
uart:
  - id: a8_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
    rx_buffer_size: 4096

interval:
  - interval: 20ms
    then:
      - lambda: a8link::client().poll();
  - interval: 1s
    then:
      - lambda: a8link::client().tick();
      - lambda: |-
          const long now = id(sntp_time).now().is_valid() ? (long) id(sntp_time).now().timestamp : 0;
          hist::history().set_now(now);
          hist::history().tick(now);
          if (hist::history().changed) { hist::history().changed = false; id(refresh_history).execute(); }
      - if:   # the countdown
          condition:
            lambda: return a8link::client().seconds_left() > 0;
          then:
            - script.execute: refresh_home
            - script.execute: refresh_zones
            - script.execute: refresh_zone
  - interval: 300ms
    then:
      - if:
          condition:
            lambda: return a8link::client().take_changed();
          then:
            - script.execute: refresh_home
            - script.execute: refresh_zones
            - script.execute: refresh_zone
            - script.execute: refresh_sched
            - script.execute: refresh_prog
            - script.execute: refresh_settings

time:
  - platform: sntp
    id: sntp_time
    timezone: America/New_York
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
          - script.execute: refresh_home   # day/night icon, "Today" after midnight
          - if:   # follow day/night while awake (not dimmed or off)
              condition:
                lambda: return id(screen_state) == 0;
              then:
                - script.execute: apply_brightness

globals:
  # Backlight levels (%), changed by sliding the left bezel; kept across restarts.
  - id: cur_zone   # the zone open on the zone page (1-8)
    type: int
    initial_value: "1"
  - id: run_min    # minutes chosen on the zone page
    type: int
    initial_value: "10"
  - id: run_zone_pending   # Run pressed: the zone to start once its minutes are sent (0 = none)
    type: int
    initial_value: "0"
  - id: cur_prog     # the program open on the program page (0-3 = A-D)
    type: int
    initial_value: "0"
  - id: prog_shown   # programs added this session but still empty (bit per program)
    type: int
    initial_value: "0"
  - id: wf_ssid       # the network chosen on the Wi-Fi page
    type: std::string
    initial_value: '""'
  - id: hist_view    # 0 = 7 days, 1 = one day
    type: int
    initial_value: "0"
  - id: hist_day     # the day shown in the day view (local day number)
    type: int
    initial_value: "0"
  # Settings PIN: on the screen only (not an HA entity). Always on; default 0000.
  - id: settings_pin_v2
    type: int
    restore_value: true
    initial_value: "0"
  - id: settings_unlocked   # until the screen next turns off
    type: bool
    initial_value: "false"
  - id: pin_mode    # 0 = unlock Settings, 1 = new PIN, 2 = confirm new PIN
    type: int
    initial_value: "0"
  - id: pin_buf
    type: std::string
    initial_value: '""'
  - id: pin_first
    type: std::string
    initial_value: '""'
  - id: slide_last_y
    type: int
    initial_value: "0"
  # While the bezel is being slid: the level shown, saved to the number only on release (each
  # step used to set the number, which re-ran refresh_settings and sent a state to HA every few ms).
  - id: slide_val
    type: float
    initial_value: "0"
  - id: sliding
    type: bool
    initial_value: "false"
  - id: screen_state   # 0 awake, 1 dimmed, 2 off
    type: int
    initial_value: "0"
  - id: is_daytime
    type: std::function<bool()>
    initial_value: |-
      []() {
        auto t = id(sntp_time).now();
        if (!t.is_valid()) return true;
        return t.hour >= (int) id(scr_day_from).state && t.hour < (int) id(scr_day_until).state;
      }

script:
  - id: pin_show
    then:
      - lambda: |-
          static const char *const t[] = {"Enter PIN", "New PIN (4 digits)", "Enter it again"};
          ui::text(id(pin_title), t[id(pin_mode) % 3]);
          ui::text(id(pin_msg), "");
          ui::text(id(pin_dots), "");
      - lvgl.widget.show: pin_sheet
  - id: pin_entered
    then:
      - lambda: |-
          std::string dots;
          for (size_t i = 0; i < 4; i++) dots += i < id(pin_buf).size() ? "* " : "_ ";
          ui::text(id(pin_dots), dots);
          ui::text(id(pin_msg), "");
          if (id(pin_buf).size() < 4) return;
          const std::string got = id(pin_buf);
          id(pin_buf) = "";
          if (id(pin_mode) == 0) {
            if (atoi(got.c_str()) == id(settings_pin_v2)) {
              id(settings_unlocked) = true;
              ui::vis(id(pin_sheet), false);
              id(refresh_settings).execute();
              lv_scr_load(ui::as_obj(id(settings_page)));
            } else {
              ui::text(id(pin_msg), "Wrong PIN");
              ui::text(id(pin_dots), "_ _ _ _ ");
            }
          } else if (id(pin_mode) == 1) {
            id(pin_first) = got;
            id(pin_mode) = 2;
            ui::text(id(pin_title), "Enter it again");
            ui::text(id(pin_dots), "_ _ _ _ ");
          } else {
            if (got == id(pin_first)) {
              id(settings_pin_v2) = atoi(got.c_str());
              id(settings_unlocked) = true;
              ui::vis(id(pin_sheet), false);
              id(refresh_settings).execute();
            } else {
              id(pin_mode) = 1;
              ui::text(id(pin_title), "New PIN (4 digits)");
              ui::text(id(pin_msg), "Didn't match - start again");
              ui::text(id(pin_dots), "_ _ _ _ ");
            }
          }
  - id: refresh_history
    then:
      - lambda: |-
          const long now = id(sntp_time).now().timestamp;
          if (now < 1600000000L) return;
          auto &h = hist::history();
          const int32_t today = hist::local_day(now);
          static const char *const wd[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
          static const char *const mo[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
          const bool week = id(hist_view) == 0;
          ui::vis(id(hv_week), week);
          ui::vis(id(hv_day), !week);
          ui::bg(id(hs_week), week ? 0x1E6091 : 0xE9EEF2); ui::fg(id(hs_week_l), week ? 0xFFFFFF : ${ink});
          ui::bg(id(hs_day), !week ? 0x1E6091 : 0xE9EEF2); ui::fg(id(hs_day_l), !week ? 0xFFFFFF : ${ink});
          // 7 days: bars scaled to the busiest day
          uint32_t maxs = 600;
          for (int d = 0; d < 7; d++) maxs = std::max(maxs, h.secs(today - (6 - d), 0));
          bool used[8] = {};
          const int H = 150;
          { const int32_t day = today - (6 - 0);
            const auto lt = esphome::ESPTime::from_epoch_local((time_t) (now - (long) (6 - 0) * 86400));
            ui::text(id(hw0_l), 0 == 6 ? std::string("Today") : std::string(wd[(lt.day_of_week + 6) % 7]));
            const uint32_t tot = h.secs(day, 0);
            ui::text(id(hw0_t), tot ? std::to_string((tot + 59) / 60) + "m" : std::string(""));
            int ybase = -22;
            { const uint32_t s = h.secs(day, 1); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s0), hh > 0);
              if (hh > 0) { used[0] = true; lv_obj_set_height(ui::as_obj(id(hw0_s0)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s0)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 2); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s1), hh > 0);
              if (hh > 0) { used[1] = true; lv_obj_set_height(ui::as_obj(id(hw0_s1)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s1)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 3); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s2), hh > 0);
              if (hh > 0) { used[2] = true; lv_obj_set_height(ui::as_obj(id(hw0_s2)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s2)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 4); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s3), hh > 0);
              if (hh > 0) { used[3] = true; lv_obj_set_height(ui::as_obj(id(hw0_s3)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s3)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 5); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s4), hh > 0);
              if (hh > 0) { used[4] = true; lv_obj_set_height(ui::as_obj(id(hw0_s4)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s4)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 6); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s5), hh > 0);
              if (hh > 0) { used[5] = true; lv_obj_set_height(ui::as_obj(id(hw0_s5)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s5)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 7); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s6), hh > 0);
              if (hh > 0) { used[6] = true; lv_obj_set_height(ui::as_obj(id(hw0_s6)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s6)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 8); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw0_s7), hh > 0);
              if (hh > 0) { used[7] = true; lv_obj_set_height(ui::as_obj(id(hw0_s7)), hh); lv_obj_set_y(ui::as_obj(id(hw0_s7)), ybase); ybase -= hh; } }
          }
          { const int32_t day = today - (6 - 1);
            const auto lt = esphome::ESPTime::from_epoch_local((time_t) (now - (long) (6 - 1) * 86400));
            ui::text(id(hw1_l), 1 == 6 ? std::string("Today") : std::string(wd[(lt.day_of_week + 6) % 7]));
            const uint32_t tot = h.secs(day, 0);
            ui::text(id(hw1_t), tot ? std::to_string((tot + 59) / 60) + "m" : std::string(""));
            int ybase = -22;
            { const uint32_t s = h.secs(day, 1); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s0), hh > 0);
              if (hh > 0) { used[0] = true; lv_obj_set_height(ui::as_obj(id(hw1_s0)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s0)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 2); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s1), hh > 0);
              if (hh > 0) { used[1] = true; lv_obj_set_height(ui::as_obj(id(hw1_s1)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s1)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 3); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s2), hh > 0);
              if (hh > 0) { used[2] = true; lv_obj_set_height(ui::as_obj(id(hw1_s2)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s2)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 4); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s3), hh > 0);
              if (hh > 0) { used[3] = true; lv_obj_set_height(ui::as_obj(id(hw1_s3)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s3)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 5); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s4), hh > 0);
              if (hh > 0) { used[4] = true; lv_obj_set_height(ui::as_obj(id(hw1_s4)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s4)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 6); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s5), hh > 0);
              if (hh > 0) { used[5] = true; lv_obj_set_height(ui::as_obj(id(hw1_s5)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s5)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 7); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s6), hh > 0);
              if (hh > 0) { used[6] = true; lv_obj_set_height(ui::as_obj(id(hw1_s6)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s6)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 8); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw1_s7), hh > 0);
              if (hh > 0) { used[7] = true; lv_obj_set_height(ui::as_obj(id(hw1_s7)), hh); lv_obj_set_y(ui::as_obj(id(hw1_s7)), ybase); ybase -= hh; } }
          }
          { const int32_t day = today - (6 - 2);
            const auto lt = esphome::ESPTime::from_epoch_local((time_t) (now - (long) (6 - 2) * 86400));
            ui::text(id(hw2_l), 2 == 6 ? std::string("Today") : std::string(wd[(lt.day_of_week + 6) % 7]));
            const uint32_t tot = h.secs(day, 0);
            ui::text(id(hw2_t), tot ? std::to_string((tot + 59) / 60) + "m" : std::string(""));
            int ybase = -22;
            { const uint32_t s = h.secs(day, 1); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s0), hh > 0);
              if (hh > 0) { used[0] = true; lv_obj_set_height(ui::as_obj(id(hw2_s0)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s0)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 2); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s1), hh > 0);
              if (hh > 0) { used[1] = true; lv_obj_set_height(ui::as_obj(id(hw2_s1)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s1)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 3); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s2), hh > 0);
              if (hh > 0) { used[2] = true; lv_obj_set_height(ui::as_obj(id(hw2_s2)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s2)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 4); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s3), hh > 0);
              if (hh > 0) { used[3] = true; lv_obj_set_height(ui::as_obj(id(hw2_s3)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s3)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 5); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s4), hh > 0);
              if (hh > 0) { used[4] = true; lv_obj_set_height(ui::as_obj(id(hw2_s4)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s4)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 6); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s5), hh > 0);
              if (hh > 0) { used[5] = true; lv_obj_set_height(ui::as_obj(id(hw2_s5)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s5)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 7); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s6), hh > 0);
              if (hh > 0) { used[6] = true; lv_obj_set_height(ui::as_obj(id(hw2_s6)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s6)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 8); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw2_s7), hh > 0);
              if (hh > 0) { used[7] = true; lv_obj_set_height(ui::as_obj(id(hw2_s7)), hh); lv_obj_set_y(ui::as_obj(id(hw2_s7)), ybase); ybase -= hh; } }
          }
          { const int32_t day = today - (6 - 3);
            const auto lt = esphome::ESPTime::from_epoch_local((time_t) (now - (long) (6 - 3) * 86400));
            ui::text(id(hw3_l), 3 == 6 ? std::string("Today") : std::string(wd[(lt.day_of_week + 6) % 7]));
            const uint32_t tot = h.secs(day, 0);
            ui::text(id(hw3_t), tot ? std::to_string((tot + 59) / 60) + "m" : std::string(""));
            int ybase = -22;
            { const uint32_t s = h.secs(day, 1); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw3_s0), hh > 0);
              if (hh > 0) { used[0] = true; lv_obj_set_height(ui::as_obj(id(hw3_s0)), hh); lv_obj_set_y(ui::as_obj(id(hw3_s0)), ybase); ybase -= hh; } }
            { const uint32_t s = h.secs(day, 2); const int hh = s ? std::max(2, (int) ((uint64_t) s * H / maxs)) : 0;
              ui::vis(id(hw3_s1), hh > 0);
              if (hh > 0) { used[1] = true; lv_obj_set_height(ui::as_obj(id(hw3_s1)), hh); lv_obj_set_y(ui::as_obj(id(hw3_s1)), ybase); ybase -= hh; } }
