      widgets:
        - button:
            styles: back_btn
            align: TOP_LEFT
            x: -8
            on_click: {lvgl.page.show: {id: zones_page, animation: MOVE_RIGHT, time: 180ms}}
            widgets:
              - label:
                  align: CENTER
                  text_font: icons_28
                  text_color: ${ink}
                  text: "\U000F0141"
        - label:
            id: zd_title
            align: TOP_LEFT
            x: 40
            y: 4
            text_font: montserrat_24
            text: ""
        - button:
            styles: back_btn
            align: TOP_RIGHT
            on_click: {lvgl.page.show: {id: zone_settings_page, animation: MOVE_LEFT, time: 180ms}}
            widgets:
              - label:
                  align: CENTER
                  text_font: icons_28
                  text_color: ${muted}
                  text: "\U000F0493"
        - obj:
            styles: card_style
            align: BOTTOM_MID
            width: 100%
            height: 248
            scrollable: false
            widgets:
              - label:
                  id: zd_head
                  align: TOP_LEFT
                  text_color: ${muted}
                  text_font: montserrat_16
                  text: "Run by hand for"
              - label:
                  id: zd_last
                  align: TOP_RIGHT
                  text_color: ${muted}
                  text_font: montserrat_16
                  text: ""
              - button:
                  id: zd_minus
                  align: CENTER
                  x: -120
                  y: -22
                  width: 56
                  height: 56
                  radius: 28
                  bg_color: 0xE9EEF2
                  shadow_width: 0
                  on_click:
                    - lambda: |-
                        if (id(run_min) > 1) id(run_min)--;
                        ui::link().set(ui::zkey(id(cur_zone), "number", "_minutes_by_hand"), std::to_string(id(run_min)));
                    - script.execute: refresh_zone
                  widgets: [{label: {align: CENTER, text_font: montserrat_28, text: "-"}}]
              - label:
                  id: zd_min
                  align: CENTER
                  y: -30
                  text_font: montserrat_28
                  text: "10"
              - label:
                  id: zd_unit
                  align: CENTER
                  y: -2
                  text_color: ${muted}
                  text_font: montserrat_16
                  text: "minutes"
              - button:
                  id: zd_plus
                  align: CENTER
                  x: 120
                  y: -22
                  width: 56
                  height: 56
                  radius: 28
                  bg_color: 0xE9EEF2
                  shadow_width: 0
                  on_click:
                    - lambda: |-
                        if (id(run_min) < 120) id(run_min)++;
                        ui::link().set(ui::zkey(id(cur_zone), "number", "_minutes_by_hand"), std::to_string(id(run_min)));
                    - script.execute: refresh_zone
                  widgets: [{label: {align: CENTER, text_font: montserrat_28, text: "+"}}]
              - button:
                  id: zd_run
                  align: BOTTOM_MID
                  width: 100%
                  height: 58
                  radius: 12
                  bg_color: 0x2E7D32
                  shadow_width: 0
                  on_click:
                    # Run: the minutes first, then (a moment later, so the A8 has surely taken them)
                    # the zone. Stop: at once.
                    - lambda: |-
                        const int n = id(cur_zone);
                        id(run_zone_pending) = 0;
                        if (ui::zone_running(n)) {
                          ui::link().set(ui::link().zone_key(n), "0");
                        } else {
                          ui::link().set(ui::zkey(n, "number", "_minutes_by_hand"), std::to_string(id(run_min)));
                          id(run_zone_pending) = n;
                        }
                    - if:
                        condition:
                          lambda: return id(run_zone_pending) > 0;
                        then:
                          - delay: 250ms
                          - lambda: |-
                              const int n = id(run_zone_pending);
                              id(run_zone_pending) = 0;
                              if (n > 0 && !ui::zone_running(n)) ui::link().set(ui::link().zone_key(n), "1");
                  widgets:
                    - label:
                        id: zd_run_label
                        align: CENTER
                        text_font: montserrat_24
                        text_color: 0xFFFFFF
                        text: "Run"

