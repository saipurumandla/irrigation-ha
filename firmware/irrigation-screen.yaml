          // Quick actions sheet
          {
            const float rdq = ui::link().get_float("number.rain_delay");
            ui::vis(id(qs_clear), !std::isnan(rdq) && rdq > 0);
            ui::text(id(qs_skip_l), ui::link().get("switch.skip_next_run") == "1" ? "Don't skip the next run" : "Skip next run");
          }
          // Flow box: only once the A8 has a flow sensor (layout checked with mock values 2026-11-05)
          ui::vis(id(flow_panel), !ui::link().get("sensor.flow_rate").empty());
          // Wi-Fi icon from the real state (the connect event can fire before the display is up)
          const bool wifi_ok = wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected();
          ui::text(id(wifi_icon), wifi_ok ? "\U000F05A9" : "\U000F05AA");
          ui::fg(id(wifi_icon), wifi_ok ? 0x2E7D32 : 0xB3261E);
          auto &l = a8link::client();
          const long now = id(sntp_time).now().timestamp;
          if (!l.up()) {
            ui::text(id(status), "Offline");
            ui::text(id(status_icon), "\U000F05D6");
            ui::fg(id(status), 0xB3261E); ui::fg(id(status_icon), 0xB3261E); ui::bg(id(status_pill), 0xFBE9E7);
            ui::text(id(next_head), "CONTROLLER");
            ui::text(id(next), "--");
            ui::text(id(next_day), "Check the cable to the controller");
          } else if (!ui::running_zone().empty()) {
            ui::text(id(status), "Running");
            ui::text(id(status_icon), "\U000F1060");
            ui::fg(id(status), 0x2E7D32); ui::fg(id(status_icon), 0x2E7D32); ui::bg(id(status_pill), 0xE8F5E9);
            ui::text(id(next_head), "WATERING");
            const long left = l.seconds_left();
            ui::text(id(next), left > 0 ? ui::mmss(left) : std::string("--"));
            ui::text(id(next_day), ui::running_zone());
          } else {
            // Idle, with an icon for what the garden is doing
            const float rd = l.get_float("number.rain_delay");
            if (!std::isnan(rd) && rd > 0) {
              ui::text(id(status), "Rain delay");
              ui::text(id(status_icon), "\U000F054A");
              ui::fg(id(status), 0x1E6091); ui::fg(id(status_icon), 0x1E6091); ui::bg(id(status_pill), 0xE3EEF7);
            } else if (l.get("switch.skip_next_run") == "1") {
              ui::text(id(status), "Skipping");
              ui::text(id(status_icon), "\U000F0662");
              ui::fg(id(status), 0x1E6091); ui::fg(id(status_icon), 0x1E6091); ui::bg(id(status_pill), 0xE3EEF7);
            } else if (id(is_daytime)()) {
              ui::text(id(status), "Idle");
              ui::text(id(status_icon), "\U000F0E66");
              ui::fg(id(status), ${muted}); ui::fg(id(status_icon), 0x2E7D32); ui::bg(id(status_pill), 0xE9F3EA);
            } else {
              ui::text(id(status), "Idle");
              ui::text(id(status_icon), "\U000F0594");
              ui::fg(id(status), ${muted}); ui::fg(id(status_icon), 0x4A4E8C); ui::bg(id(status_pill), 0xECEDF6);
            }
            ui::text(id(next_head), "NEXT RUN");
            const std::string n = l.get("text_sensor.next_run");
            ui::text(id(next), n.empty() ? std::string("Set one up in Schedule") : ui::when_time(n));
            ui::text(id(next_day), n.empty() ? std::string("No runs set") : ui::when_day(n, now));
          }
      - lvgl.label.update:
          id: badges
          text: !lambda |-
            auto &l = a8link::client();
            std::string b;
            const float rd = l.get_float("number.rain_delay");
            if (!std::isnan(rd) && rd > 0) b += "Rain delay " + std::to_string((int) rd) + (rd == 1 ? " day" : " days");
            if (l.get("switch.skip_next_run") == "1") b += std::string(b.empty() ? "" : "   ") + "Skipping next run";
            return b;
  - id: update_clock   # "Wed, Nov 5   7:42 PM" (built by hand: no %-I in the ESP32's C library)
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto t = id(sntp_time).now();
            if (!t.is_valid()) return std::string("");
            static const char *const days[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
            static const char *const months[] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun",
                                                 "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
            int h = t.hour % 12;
            char buf[40];
            snprintf(buf, sizeof(buf), "%s, %s %d     %d:%02d %s", days[(t.day_of_week + 6) % 7],
                     months[(t.month + 11) % 12], t.day_of_month, h == 0 ? 12 : h, t.minute, t.hour < 12 ? "AM" : "PM");
            return std::string(buf);
  - id: apply_brightness
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          transition_length: 0s
          brightness: !lambda |-
            float lvl = id(sliding) ? id(slide_val) : (id(is_daytime)() ? id(scr_day).state : id(scr_night).state);
            if (id(screen_state) == 1) lvl /= 3;
            return std::max(0.03f, lvl / 100.0f);
      - lvgl.label.update:
          id: bright_tag
          text: !lambda |-
            static char buf[24];
            snprintf(buf, sizeof(buf), "Brightness %d%%", (int) (id(sliding) ? id(slide_val) : (id(is_daytime)() ? id(scr_day).state : id(scr_night).state)));
            return buf;

number:
  # The screen's own settings (Settings > Screen on the screen, or here in HA).
  - platform: template
    id: scr_dim
    on_value:
      - script.execute: refresh_settings
      - script.execute: apply_brightness
    name: "Dim after"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 600
    step: 5
    initial_value: ${dim_after}
    unit_of_measurement: "s"
  - platform: template
    id: scr_off
    on_value:
      - script.execute: refresh_settings
      - script.execute: apply_brightness
    name: "Off after"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 15
    max_value: 1800
    step: 15
    initial_value: ${off_after}
    unit_of_measurement: "s"
  - platform: template
    id: scr_day_from
    on_value:
      - script.execute: refresh_settings
      - script.execute: apply_brightness
    name: "Day starts"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${day_from}
    unit_of_measurement: "h"
  - platform: template
    id: scr_day_until
    on_value:
      - script.execute: refresh_settings
      - script.execute: apply_brightness
    name: "Day ends"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${day_until}
    unit_of_measurement: "h"
  - platform: template
    id: scr_day
    on_value:
      - script.execute: refresh_settings
      - script.execute: apply_brightness
    name: "Day brightness"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 70
    unit_of_measurement: "%"
  - platform: template
    id: scr_night
    on_value:
      - script.execute: refresh_settings
      - script.execute: apply_brightness
    name: "Night brightness"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 100
    step: 1
    initial_value: 30
    unit_of_measurement: "%"

output:
  - platform: gpio
    id: amp_off
    pin: GPIO1
  - platform: ledc
    id: backlight_pwm
    pin: GPIO41

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

external_components:
  - source:
      type: local
      path: components
    components: [st77922_qspi]

display:
  # ESPHome's mipi_spi woke the panel but never showed an image; this driver uses Espressif's
  # esp_lcd_st77922 with the seller's own init table (both needed), and resets the whole chip on
  # GPIO48 first (it resets display AND touch, so the touchscreen below must not have a reset pin).
  - platform: st77922_qspi
    id: lcd
    dimensions:
      width: 320
      height: 480
    reset_pin: GPIO48
    te_pin: GPIO42      # tearing effect (LCD_TE): writes wait for it
    cs_pin: GPIO10
    clk_pin: GPIO12
    data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]
    update_interval: never

i2c:
  - id: touch_i2c
    sda: GPIO38
    scl: GPIO39
    scan: true
    frequency: 400kHz

touchscreen:
  - platform: st7123
    id: touch
    i2c_id: touch_i2c
    address: 0x55
    interrupt_pin: GPIO47
    on_touch:
      - if:
          condition:
            lambda: return id(screen_state) != 0;
          then:
            - lambda: id(screen_state) = 0;
            - lvgl.resume:
            - script.execute: apply_brightness

font:
  # Material Design Icons (Apache 2.0): only the glyphs used here are built in.
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_40
    size: 40
    glyphs:
      - "\U000F1060"   # sprinkler-variant  (Zones)
      - "\U000F00F0"   # calendar-clock     (Schedule)
      - "\U000F0128"   # chart-bar          (History)
      - "\U000F0493"   # cog                (Settings)
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_28
    size: 28
    glyphs:
      - "\U000F0141"   # chevron-left (back)
      - "\U000F054A"   # umbrella     (rain delay)
      - "\U000F04AD"   # skip-next
      - "\U000F04DB"   # stop
      - "\U000F0493"   # cog (zone settings)
      - "\U000F03EB"   # pencil (rename)
      - "\U000F0156"   # close
      - "\U000F00DF"   # brightness-6        (Settings > Screen)
      - "\U000F02FD"   # information-outline (Settings > About)
      - "\U000F05A9"   # wifi                (Settings > Wi-Fi)
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_20
    size: 20
    glyphs:
      - "\U000F05A9"   # wifi
      - "\U000F05AA"   # wifi-off
      - "\U000F0339"   # link-variant      (A8 link up)
      - "\U000F033A"   # link-variant-off  (A8 link down)
      - "\U000F058C"   # water             (flow)
      - "\U000F185A"   # waves-arrow-right (flow panel)
      - "\U000F0E66"   # sprout               (idle, day)
      - "\U000F0594"   # weather-night        (idle, night)
      - "\U000F054A"   # umbrella             (rain delay)
      - "\U000F0662"   # skip-next-circle-outline (skipping)
      - "\U000F1060"   # sprinkler-variant    (running)
      - "\U000F05D6"   # alert-circle-outline (offline)

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  rotation: 90
  buffer_size: 25%
  on_idle:
    - timeout: !lambda return (uint32_t) (id(scr_dim).state * 1000);
      then:
        - lambda: id(screen_state) = 1;
        - script.execute: apply_brightness
    - timeout: !lambda return (uint32_t) (id(scr_off).state * 1000);
      then:
        - lambda: |-
            id(screen_state) = 2;
            id(settings_unlocked) = false;
        - light.turn_off: {id: backlight, transition_length: 1s}
        - lvgl.pause:
            show_snow: false
  theme:
    label:
      text_color: ${ink}
  style_definitions:
    - id: page_style
      bg_color: ${paper}
      pad_top: 12
      pad_bottom: 12
      pad_right: 14
      pad_left: !lambda return ${bezel_left} + 14;
    - id: card_style
      bg_color: 0xFFFFFF
      border_width: 0
      radius: 14
      pad_all: 14
      shadow_width: 0
    - id: app_btn
      radius: 40
      width: 80
      height: 80
      shadow_width: 0
    - id: back_btn
      bg_opa: TRANSP
      shadow_width: 0
      width: 44
      height: 40
      pad_all: 0

  # On every page: the black left bezel (the panel's picture is off-centre in its glass, so this
  # balances the black edge at the top and right) doubles as a hidden brightness control.
  top_layer:
    widgets:
      - obj:
          id: bezel_strip
          x: 0
          y: 0
          width: ${bezel_left}
          height: 100%
          bg_color: 0x000000
          border_width: 0
          radius: 0
          scrollable: false
          on_press:
            - lambda: |-
                id(slide_last_y) = point.y;
                id(slide_val) = id(is_daytime)() ? id(scr_day).state : id(scr_night).state;
                id(sliding) = true;
            - lvgl.widget.show: bright_tag
          on_pressing:
            - lambda: |-
                int dy = id(slide_last_y) - point.y;   // up = positive
                if (dy == 0) return;
                id(slide_last_y) = point.y;
                id(slide_val) = std::max(5.0f, std::min(100.0f, id(slide_val) + dy * 0.35f));
            - script.execute: apply_brightness
          on_release:
            - lambda: |-
                if (!id(sliding)) return;
                id(sliding) = false;
                auto *n = id(is_daytime)() ? id(scr_day) : id(scr_night);
                auto c = n->make_call();
                c.set_value(roundf(id(slide_val)));
                c.perform();
            - delay: 1500ms
            - lvgl.widget.hide: bright_tag
      # Rename a zone: a popup with a text box and keyboard (the name lives on the A8, so HA sees it)
      - obj:
          id: rn_sheet
          hidden: true
          x: ${bezel_left}
          y: 0
          width: !lambda return 480 - ${bezel_left};
          height: 320
          bg_color: ${paper}
          border_width: 0
          radius: 0
          pad_all: 10
          scrollable: false
          widgets:
            - label:
                id: rn_title
                align: TOP_LEFT
                y: 10
                text_font: montserrat_20
                text: "Rename zone"
            - textarea:
                id: rn_text
                align: TOP_LEFT
                y: 40
                width: 250
                height: 44
                one_line: true
                max_length: 20
                text_font: montserrat_20
                placeholder_text: "Zone name"
            - button:
                align: TOP_RIGHT
                x: -86
                y: 40
                width: 80
                height: 44
                radius: 10
                bg_color: 0xE9EEF2
                shadow_width: 0
                on_click:
                  - lvgl.widget.hide: rn_sheet
                widgets: [{label: {align: CENTER, text_font: montserrat_18, text: "Cancel"}}]
            - button:
                align: TOP_RIGHT
                y: 40
                width: 80
                height: 44
                radius: 10
                bg_color: 0x2E7D32
                shadow_width: 0
                on_click:
                  - script.execute: rename_save
                widgets: [{label: {align: CENTER, text_font: montserrat_18, text_color: 0xFFFFFF, text: "Save"}}]
            - keyboard:
                id: rn_kb
                textarea: rn_text
                mode: TEXT_LOWER
                align: BOTTOM_MID
                width: 100%
                height: 210
                on_ready:
                  - script.execute: rename_save
                on_cancel:
                  - lvgl.widget.hide: rn_sheet
      # Join a network: name (only for "Other network"), password, keyboard.
      - obj:
          id: wf_sheet
          hidden: true
          x: ${bezel_left}
          y: 0
          width: !lambda return 480 - ${bezel_left};
          height: 320
          bg_color: ${paper}
          border_width: 0
          radius: 0
          pad_all: 10
          scrollable: false
          widgets:
            - label: {id: wf_title, align: TOP_LEFT, y: 4, text_font: montserrat_20, text: "Join"}
            - textarea:
                id: wf_ssid_ta
                hidden: true
                align: TOP_RIGHT
                y: 0
                width: 220
                height: 36
                one_line: true
                max_length: 32
                text_font: montserrat_16
                placeholder_text: "Network name"
                on_focus:
                  - lambda: lv_keyboard_set_textarea(ui::as_obj(id(wf_kb)), ui::as_obj(id(wf_ssid_ta)));
            - textarea:
                id: wf_pw
                align: TOP_LEFT
                y: 44
                width: 200
                height: 40
                one_line: true
                password_mode: true
                max_length: 64
                text_font: montserrat_18
                placeholder_text: "Password"
                on_focus:
                  - lambda: lv_keyboard_set_textarea(ui::as_obj(id(wf_kb)), ui::as_obj(id(wf_pw)));
            - button:
                align: TOP_LEFT
                x: 206
                y: 44
                width: 56
                height: 40
                radius: 10
                bg_color: 0xE9EEF2
                shadow_width: 0
                on_click:
                  - lambda: lv_textarea_set_password_mode(ui::as_obj(id(wf_pw)), !lv_textarea_get_password_mode(ui::as_obj(id(wf_pw))));
                widgets: [{label: {align: CENTER, text_font: montserrat_14, text: "Show"}}]
            - button:
                align: TOP_RIGHT
                x: -84
                y: 44
                width: 76
                height: 40
                radius: 10
                bg_color: 0xE9EEF2
                shadow_width: 0
                on_click: [lvgl.widget.hide: wf_sheet]
                widgets: [{label: {align: CENTER, text_font: montserrat_16, text: "Cancel"}}]
            - button:
                align: TOP_RIGHT
                y: 44
                width: 80
                height: 40
                radius: 10
                bg_color: 0x2E7D32
                shadow_width: 0
                on_click:
                  - lambda: |-
                      std::string ssid = id(wf_ssid).empty() ? ui::ta_text(id(wf_ssid_ta)) : id(wf_ssid);
                      if (ssid.empty()) return;
                      id(join_wifi).execute(ssid, ui::ta_text(id(wf_pw)));
                  - lvgl.widget.hide: wf_sheet
                widgets: [{label: {align: CENTER, text_font: montserrat_16, text_color: 0xFFFFFF, text: "Connect"}}]
            - keyboard:
                id: wf_kb
                textarea: wf_pw
                mode: TEXT_LOWER
                align: BOTTOM_MID
                width: 100%
                height: 214
                on_cancel: [lvgl.widget.hide: wf_sheet]
      # Settings PIN keypad
      - obj:
          id: pin_sheet
          hidden: true
          x: ${bezel_left}
          y: 0
          width: !lambda return 480 - ${bezel_left};
          height: 320
          bg_color: ${paper}
          border_width: 0
          radius: 0
          pad_all: 10
          scrollable: false
          widgets:
            - label: {id: pin_title, align: TOP_LEFT, y: 6, text_font: montserrat_20, text: "Enter PIN"}
            - label: {id: pin_dots, align: TOP_LEFT, y: 40, text_font: montserrat_28, text: ""}
            - label: {id: pin_msg, align: TOP_LEFT, y: 84, width: 120, long_mode: WRAP, text_color: 0xB3261E, text_font: montserrat_14, text: ""}
            - button:
                align: BOTTOM_LEFT
                width: 110
                height: 44
                radius: 10
                bg_color: 0xE9EEF2
                shadow_width: 0
                on_click: [lvgl.widget.hide: pin_sheet]
                widgets: [{label: {align: CENTER, text_font: montserrat_16, text: "Cancel"}}]
            - obj:
                align: RIGHT_MID
                width: 280
                height: 196
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                widgets:
                  - button:
                      x: 0
                      y: 0
                      width: 88
